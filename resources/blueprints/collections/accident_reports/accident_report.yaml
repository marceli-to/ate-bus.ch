title: Unfallmeldung
tabs:
  main:
    display: Meldung
    sections:
      -
        fields:
          -
            handle: submitted_at
            field:
              type: date
              display: 'Eingereicht am'
              time_enabled: true
              time_seconds_enabled: true
              format: 'd.m.Y H:i'
              visibility: read_only
              listable: true
          -
            handle: type
            field:
              type: text
              display: Art
              visibility: read_only
              listable: true
          -
            handle: recipient
            field:
              type: text
              display: 'E-Mail an'
              visibility: read_only
              width: 50
          -
            handle: copy_to
            field:
              type: text
              display: 'Kopie an'
              visibility: read_only
              width: 50
          -
            handle: files
            field:
              type: assets
              display: 'Fotos und Bericht'
              instructions: 'Unfallbericht.html = vollständiger Bericht zum Öffnen und Drucken.'
              container: unfallmeldungen
              mode: grid
              visibility: read_only
          -
            handle: report
            field:
              type: textarea
              display: Bericht
              visibility: read_only
          -
            handle: mail_sent
            field:
              type: toggle
              display: 'Mail versendet'
              instructions: 'Aus = Mail an ATE ist fehlgeschlagen, Meldung nur hier gespeichert.'
              visibility: read_only
              listable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
              visibility: read_only
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
