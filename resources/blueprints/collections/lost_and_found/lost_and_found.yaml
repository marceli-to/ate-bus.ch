title: Verlustmeldung
tabs:
  main:
    display: Meldung
    sections:
      -
        fields:
          -
            handle: submitted_at
            field:
              type: date
              display: 'Eingereicht am'
              time_enabled: true
              time_seconds_enabled: true
              format: 'd.m.Y H:i'
              visibility: read_only
          -
            handle: gender
            field:
              type: select
              display: Anrede
              options:
                frau: Frau
                herr: Herr
          -
            handle: firstname
            field:
              type: text
              display: Vorname
          -
            handle: lastname
            field:
              type: text
              display: Nachname
          -
            handle: email
            field:
              type: text
              display: E-Mail
              input_type: email
          -
            handle: phone
            field:
              type: text
              display: Telefon
          -
            handle: date
            field:
              type: text
              display: Datum
          -
            handle: time
            field:
              type: text
              display: Uhrzeit
          -
            handle: bus_line
            field:
              type: text
              display: Buslinie
          -
            handle: description
            field:
              type: textarea
              display: Beschreibung
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
              visibility: read_only
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
